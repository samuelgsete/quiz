<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/base.css">
        <link rel="stylesheet" href="./css/login.css">
        <title>Bem-vindo(a) ao Quiz</title>
    </head>
    <body>

        <img src="./logo.png" alt="Logotipo" width="200px">        
        <h1>Bem-vindo(a) Competidor(a)</h1>
        <p>Pronto para um novo desafio?&#x1f3af;</p>

        <form name="login" method="POST">
            <div class="form-field">
                <label for="nome">Qual o seu nome?</label>
                <input 
                    id="nome"
                    name="nome"
                    type="text"
                    minlength="2"
                    maxlength="50"
                    pattern="[A-Za-zÀ-ÿ]+(?: [A-Za-zÀ-ÿ]+)+"
                    title="Informe apenas letras"
                    autofocus
                    required
                >
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <script>
            const form = document.forms['login'];
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const dados = new FormData(e.target);
                const nome = dados.get('nome').trim();

                if(!nome.trim()) {
                    alert('Informe o seu nome para iniciar o quiz');
                    return;
                }

                localStorage.setItem('competidor', nome);
                localStorage.setItem('acertos', 0);
                localStorage.setItem('erros', 0);

                window.location.href = './selecionar_quiz.html';
            });
        </script>
    </body>
</html>
