<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/base.css">
        <link rel="stylesheet" href="assets/css/login.css">
        <title>Bem-vindo(a) ao Quiz</title>
    </head>
    <body>

        <section>
            <img src="./logo.png" alt="Logotipo" width="200px">        
            <h1>Olá, Competidor(a)</h1>
            <p>Pronto para um novo desafio?&#x1f3af;</p>

            <form name="login" method="POST">
                <div class="form-field">
                    <label for="nome">Qual o seu CPF?</label>
                    <input 
                        id="cpf"
                        name="cpf"
                        type="text"
                        maxlength="14"
                        placeholder="Ex: 000.000.000-00"
                        autofocus
                        required
                    >
                </div>
                <button class="btn btn-primary" type="submit">Entrar</button>
            </form>
        </section>

        <script>
            const form = document.forms['login'];
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const cpf = form.cpf.value.trim();

                if(!cpf) {
                    alert('Informe o seu CPF para iniciar o quiz');
                    return;
                }

                const alunos = await runGet(`alunos?cpf=${cpf}`);
                if(!alunos) {
                    alert('Usuário não encontrado :(');
                    return;
                }
        
                const aluno = alunos[0];
                localStorage.setItem('aluno', JSON.stringify(aluno));

                goTo('./quiz/selecionar.html');

            });
        </script>

        <script src="assets/js/api.js"></script>
        <script src="assets/js/http.js"></script>
        <script src="assets/js/loading.js"></script>
        <script src="assets/js/router.js"></script>
    </body>
</html>
