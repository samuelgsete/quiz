<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
        <link rel="stylesheet" href="../assets/css/base.css">
        <link rel="stylesheet" href="../assets/css/formulario.css">
        <title>Editar aluno</title>
    </head>
    <body onload="carregarAluno()">

        <section>

            <img id="home" src="../assets/img/logo.png" alt="Logotipo" width="200px">        
            <h1>Novo aluno(a)</h1>
            <p>Registre novos alunos e alunas</p>

            <form name="cadastro" method="POST">

                <input type="hidden" name="id" readonly>

                <div class="form-field">
                    <label for="nome">Nome completo:</label>
                    <input id="nome" type="text" name="nome" placeholder="Ex: João Pedro" maxlength="50" required>
                </div>

                <div class="form-field">
                    <label for="turma">Turma:</label>
                    <input id="turma" type="text" name="turma" placeholder="Ex: ddw-2601" maxlength="10" required>
                </div>

                <div class="form-field">
                    <label for="cpf">CPF:</label>
                    <input id="cpf" type="text" name="cpf" placeholder="Ex: 000.000.000-00" maxlength="14" required>
                </div>

                <button class="btn btn-primary" type="submit">Salvar</button>
                <button class="btn btn-light" type="button" onclick="goTo('novo.html')">
                    Novo
                </button>
                <button class="btn btn-outline" type="button" onclick="goTo('listar.html')">
                    Ver alunos
                </button>

            </form>
            
        </section>

        <script>
            
            const form = document.forms['cadastro'];
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

               const { id, nome, turma, cpf } = form;

                const novoAluno = {
                    nome: nome.value.trim(),
                    turma: turma.value.trim(),
                    cpf: cpf.value.trim()
                }

                const ok = await runPut(`alunos/${id.value}`, novoAluno);
             
                if(!ok) {
                    alert('Deu ruim :( Tente novamente!');
                    return;
                }

                alert('Perfeito :) Tudo ok!');
                reload();
            });

            async function carregarAluno() {
                const id_aluno = localStorage.getItem('id_aluno');
                const aluno = await runGet(`alunos/${id_aluno}`);
                const form = document.forms['cadastro'];
                props = ['id', 'nome', 'turma', 'cpf'];
                props.forEach(campo => {
                    form.elements[campo].value = aluno[campo];
                });
            }

        </script>

        <script src="../assets/js/api.js"></script>
        <script src="../assets/js/http.js"></script>
        <script src="../assets/js/loading.js"></script>
        <script src="../assets/js/router.js"></script>
        
    </body>
</html>
