<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/base.css">
        <link rel="stylesheet" href="./css/quiz.css">
        <title>Boa sorte :)</title>
    </head>
    <body onload="init()">

        <section>
            <img src="./logo.png" alt="Logotipo" width="200px"> 
            <p>Boa sorte <strong id="competidor">Competidor</strong>&#x1F340;</p>
        
            <div id="quiz">
                <span>Carregando...</span>
            </div>

            <button class="btn btn-outline" type="button" onclick="concluirTeste()" >Concluir Teste</button>
        </section>

        <script src="./js/api.js"></script>

        <script>

            async function init()
            {
                verificarLogin();

                const perguntas = await carregarQuiz();
                localStorage.setItem('perguntas', JSON.stringify(perguntas));
                localStorage.setItem('total_perguntas', perguntas.length);
                renderizarQuiz(perguntas);
            }

            async function carregarQuiz() 
            {                                               
                const resposta = await fetch(API_URL);
                if(!resposta.ok) {
                    alert('Não foi possível carregar as perguntas do quiz');
                    return;
                }

                return resposta.json();
            }
            
            function renderizarQuiz(perguntas) {

                let htmlQuiz = perguntas.map((pergunta) => {
                    return `
                        <div class="pergunta">
                            <strong>Questão ${pergunta.numero}</strong>
                            <div class="form-field-radio">
                                <div>${pergunta.enunciado}</div>
                                ${pergunta.alternativas.map((alternativa) => {
                                    return renderizarAlternativa(pergunta, alternativa);     
                                }).join("")}
                            </div>
                            <div id="status-${pergunta.numero}"></div>
                        </div>
                    `;
                });
                const divQuiz = document.getElementById('quiz');
                divQuiz.innerHTML = htmlQuiz.join("");
            }

            function renderizarAlternativa(pergunta, alternativa) {

                const name = `q${pergunta.id}`;
                const id = `${name}-${alternativa.item}`;
                                
                return `
                    <input 
                        type="radio" 
                        id="${id}" 
                        name="${name}" 
                        onclick="responderPergunta('${pergunta.id}', '${alternativa.item}', '${name}')"
                    >
                    <label for="${id}">
                        ${alternativa.item}) ${alternativa.descricao}
                    </label>
                    <br>
                `;
            }

            async function responderPergunta(idPergunta, item, nameInput)
            {
                const perguntas = JSON.parse(localStorage.getItem('perguntas'));
                const pergunta = perguntas.find(pergunta => pergunta.id === idPergunta);

                const acerto = pergunta.gabarito === item;              
                const status = acerto ? '✅ Você acertou :)' : '❌ Você errou :(';
                document.getElementById(`status-${pergunta.numero}`).innerHTML = status;

                const acertos = parseInt(localStorage.getItem('acertos'));
                const erros = parseInt(localStorage.getItem('erros'));

                if(acerto) {
                    localStorage.setItem('acertos', acertos + 1);
                }
                else {
                    localStorage.setItem('erros', erros + 1);
                }

                const inputs = document.querySelectorAll(`input[name="${nameInput}"]`);
                inputs.forEach(input => {
                    input.disabled = true;
                });
            }

            function verificarLogin() 
            {
                const competidor = localStorage.getItem('competidor');
                document.getElementById('competidor').innerText = competidor;

                if(!competidor) {
                    window.location.href = './index.html';
                    return;
                }

                localStorage.setItem('acertos', 0);
                localStorage.setItem('erros', 0);
                localStorage.setItem('nota', 0);
            }

            function concluirTeste() {

                const acertos = parseInt(localStorage.getItem('acertos'));
                const total_perguntas = parseInt(localStorage.getItem('total_perguntas'));
                const nota = Number(((acertos / total_perguntas) * 10).toFixed(2));

                localStorage.setItem('nota', nota);

                window.location.href = './resultado.html';
            }

    </script>

    </body>
</html>
