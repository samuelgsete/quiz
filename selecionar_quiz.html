<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/base.css">
        <link rel="stylesheet" href="./css/selecionar_quiz.css">
        <title>Selecione o Quiz</title>
    </head>
    <body>

        <img src="./logo.png" alt="Logotipo" width="200px">        
        <h1>Olá, <span id="usuario">Samuel</span></h1>
        <p>Qual teste você quer fazer hoje?&#129300;</p>

        <form name="selecionar_quiz" method="POST">
            <div class="form-field">
                <label for="quiz_selecionado">Selecione a aula</label>
                <select id="quiz_selecionado" name="quiz_selecionado" required>
                    <option value="">selecione...</option>
                    <option value="1">Aula 1 - Introdução ao HTML</option>
                    <option value="2">Aula 2 - Tags de texto e Listas</option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Iniciar</button>
        </form>

        <script>

            const usuarioLogado = getUsuario();
           
            if(!usuarioLogado) {
                alert('Faça login para continuar');
                window.location.href = "./login.html";
            }

            document.getElementById('usuario').innerHTML = usuarioLogado;

            const form = document.forms['selecionar_quiz'];
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const dados = new FormData(e.target);

                const quiz_selecionado = dados.get('quiz_selecionado');
                localStorage.setItem('quiz_selecionado', quiz_selecionado);
            
                window.location.href = './quiz.html';
            });

            function getUsuario() {
                return localStorage.getItem('competidor');
            }
        </script>
    </body>
</html>
